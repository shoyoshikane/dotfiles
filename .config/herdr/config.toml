onboarding = false

[terminal]
default_shell = ""
shell_mode = "auto"
new_cwd = "follow"

[update]
channel = "stable"
version_check = false
manifest_check = true

[keys]
prefix = "ctrl+q"

[ui]
show_agent_labels_on_pane_borders = true
agent_panel_sort = "spaces"

[session]
resume_agents_on_restore = true

[experimental]
allow_nested = false
kitty_graphics = true
pane_history = true

[advanced]
scrollback_limit_bytes = 10000000
